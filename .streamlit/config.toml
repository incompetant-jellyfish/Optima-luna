# Skip Streamlit's first-run email prompt (it blocks `make run` on a fresh machine)
# and don't send usage statistics. Open the printed Local URL in a browser.
[server]
headless = true

[browser]
gatherUsageStats = false

# Theme from the team's reference palette: Fae Fruit #D97352, Opal #6850AD,
# Blood Bargain #6B0733, Thorn Crown #2D1036. ONE palette, shared with app/main.py (PALETTE):
#   bg #120A17  panel #1C0F24  panel2 #2D1036  border #3B2048  text #EDE3EA  dim #9C8AA6
#   accent #D97352  data #9A86DA  ok #C9A6E0  alert #C2476B
[theme]
base = "dark"
primaryColor = "#D97352"
backgroundColor = "#120A17"
secondaryBackgroundColor = "rgba(45, 16, 54, 0.55)"
textColor = "#EDE3EA"
borderColor = "#3B2048"
dataframeBorderColor = "#3B2048"
dataframeHeaderBackgroundColor = "#2D1036"
dataframeHeaderTextColor = "#EBA588"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
linkColor = "#9A86DA"
codeTextColor = "#9A86DA"
codeBackgroundColor = "#1C0F24"
# Alert / badge colours mapped onto the same palette (no stock Streamlit hues).
redColor = "#C2476B"
redTextColor = "#E58AA4"
redBackgroundColor = "rgba(107, 7, 51, 0.35)"
orangeColor = "#D97352"
orangeTextColor = "#EBA588"
orangeBackgroundColor = "rgba(217, 115, 82, 0.12)"
yellowColor = "#D97352"
yellowTextColor = "#EBA588"
yellowBackgroundColor = "rgba(217, 115, 82, 0.1)"
blueColor = "#9A86DA"
blueTextColor = "#BFB1EA"
blueBackgroundColor = "rgba(104, 80, 173, 0.18)"
greenColor = "#C9A6E0"
greenTextColor = "#DCC5EB"
greenBackgroundColor = "rgba(201, 166, 224, 0.1)"
violetColor = "#6850AD"
violetTextColor = "#BFB1EA"
violetBackgroundColor = "rgba(104, 80, 173, 0.18)"
grayColor = "#9C8AA6"
grayTextColor = "#BBAEC2"
grayBackgroundColor = "rgba(156, 138, 166, 0.1)"
font = "'Chakra Petch':https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap"
headingFont = "Orbitron:https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap"
codeFont = "'Share Tech Mono':https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"
metricValueFontWeight = 500
chartCategoricalColors = ["#D97352", "#6850AD", "#C9A6E0", "#C2476B", "#6B0733", "#EBA588"]

[theme.sidebar]
backgroundColor = "#0E0712"
secondaryBackgroundColor = "#1C0F24"
borderColor = "#3B2048"
