# Skip Streamlit's first-run email prompt (it blocks `make run` on a fresh machine)
# and don't send usage statistics. Open the printed Local URL in a browser.
[server]
headless = true

[browser]
gatherUsageStats = false

# "Lunar ops console" theme. ONE palette, shared with app/main.py (PALETTE):
#   bg #07090C  panel #0E1318  border #232D36  text #D3DBE0  dim #7C8B95
#   accent (amber) #D08A57  data (ice teal) #7DB4BF  ok (sage) #93B98F  alert #C46A60
[theme]
base = "dark"
primaryColor = "#D08A57"
backgroundColor = "#07090C"
secondaryBackgroundColor = "#0E1318"
textColor = "#D3DBE0"
borderColor = "#232D36"
dataframeBorderColor = "#232D36"
dataframeHeaderBackgroundColor = "#141B22"
dataframeHeaderTextColor = "#E2B48E"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "none"
buttonRadius = "none"
linkColor = "#7DB4BF"
codeTextColor = "#7DB4BF"
codeBackgroundColor = "#0E1318"
# Alert / badge colours mapped onto the same palette (no stock Streamlit hues).
redColor = "#C46A60"
redTextColor = "#E0A39B"
redBackgroundColor = "rgba(196, 106, 96, 0.12)"
orangeColor = "#D08A57"
orangeTextColor = "#E2B48E"
orangeBackgroundColor = "rgba(208, 138, 87, 0.12)"
yellowColor = "#D08A57"
yellowTextColor = "#E2B48E"
yellowBackgroundColor = "rgba(208, 138, 87, 0.10)"
blueColor = "#7DB4BF"
blueTextColor = "#A9CDD4"
blueBackgroundColor = "rgba(125, 180, 191, 0.10)"
greenColor = "#93B98F"
greenTextColor = "#B9D3B6"
greenBackgroundColor = "rgba(147, 185, 143, 0.10)"
grayColor = "#7C8B95"
grayTextColor = "#A7B3BA"
grayBackgroundColor = "rgba(124, 139, 149, 0.10)"
font = "'Chakra Petch':https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap"
headingFont = "Orbitron:https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap"
codeFont = "'Share Tech Mono':https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"
metricValueFontWeight = 500
chartCategoricalColors = ["#D08A57", "#7DB4BF", "#93B98F", "#C46A60", "#A99BC9", "#C9B37A"]

[theme.sidebar]
backgroundColor = "#090C10"
secondaryBackgroundColor = "#0E1318"
borderColor = "#232D36"
